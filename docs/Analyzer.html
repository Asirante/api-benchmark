<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>API Benchmark Analyzer v3</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#f0f2f5;--card:#fff;--border:#e2e6ea;--text:#1a1d23;--sub:#6b7280;--accent:#2563eb;--green:#059669;--red:#dc2626;--orange:#d97706}
body{font-family:'IBM Plex Sans',sans-serif;background:var(--bg);color:var(--text);overflow:hidden;height:100vh;display:flex}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:#c4c8cc;border-radius:3px}
.mono{font-family:'JetBrains Mono',monospace;font-size:12px}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px}
.chip{display:inline-flex;align-items:center;padding:4px 10px;border-radius:6px;font-size:11px;font-weight:600;cursor:pointer;border:1.5px solid var(--border);transition:all .15s;user-select:none}
.chip.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.chip:hover:not(.active){background:#f0f4ff;border-color:var(--accent)}
.drop-zone{border:2px dashed var(--border);border-radius:12px;padding:28px;text-align:center;transition:all .2s;cursor:pointer}
.drop-zone:hover,.drop-zone.dragover{border-color:var(--accent);background:#eff6ff}
.stat-value{font-size:24px;font-weight:700;line-height:1.1}
.stat-label{font-size:10px;font-weight:600;color:var(--sub);text-transform:uppercase;letter-spacing:.4px;margin-top:3px}
.accordion-toggle{cursor:pointer;user-select:none;display:flex;align-items:center;justify-content:space-between}
.accordion-toggle .arrow{transition:transform .2s;font-size:12px}
.accordion-toggle.open .arrow{transform:rotate(180deg)}
.desc{font-size:11px;color:var(--sub);font-weight:500;line-height:1.4;margin:4px 0 12px;padding:6px 10px;background:#f8fafc;border-radius:6px;border-left:3px solid var(--accent)}
.section-title{font-size:15px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.section-title .dot{width:8px;height:8px;border-radius:50%}
</style>
</head>
<body>
<!-- SIDEBAR -->
<aside style="width:320px;border-right:1px solid var(--border);background:#fff;display:flex;flex-direction:column;height:100vh;flex-shrink:0">
  <div style="padding:16px 20px;border-bottom:1px solid var(--border)">
    <h1 style="font-size:18px;font-weight:700">Benchmark <span style="color:var(--accent)">Analyzer</span></h1>
    <p style="font-size:10px;color:var(--sub);margin-top:2px">REST · GraphQL · gRPC · Envoy</p>
  </div>
  <div style="padding:14px;border-bottom:1px solid var(--border)">
    <div class="drop-zone" id="dropZone" ondrop="handleDrop(event)" ondragover="event.preventDefault();this.classList.add('dragover')" ondragleave="this.classList.remove('dragover')">
      <input type="file" id="fileInput" multiple accept=".csv" style="display:none" onchange="handleFiles(this.files)">
      <div style="font-size:12px;font-weight:600;color:var(--sub)" onclick="document.getElementById('fileInput').click()">CSV 드래그 / 클릭</div>
      <div id="fileCount" style="font-size:11px;color:var(--accent);margin-top:4px;font-weight:600"></div>
    </div>
  </div>
  <div id="filterPanel" style="padding:14px;flex:1;overflow-y:auto;display:none">
    <div style="margin-bottom:14px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
        <span style="font-size:11px;font-weight:700">VUs (부하 단계)</span>
        <span style="font-size:10px;font-weight:600;color:var(--accent);cursor:pointer" onclick="toggleAll('vus')">ALL</span>
      </div>
      <div id="fVus" style="display:flex;flex-wrap:wrap;gap:4px"></div>
    </div>
    <div style="margin-bottom:14px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
        <span style="font-size:11px;font-weight:700">TC (테스트 케이스)</span>
        <span style="font-size:10px;font-weight:600;color:var(--accent);cursor:pointer" onclick="toggleAll('tc')">ALL</span>
      </div>
      <div id="fTc" style="display:flex;flex-wrap:wrap;gap:4px"></div>
    </div>
    <div style="margin-bottom:14px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
        <span style="font-size:11px;font-weight:700">Architecture (API)</span>
        <span style="font-size:10px;font-weight:600;color:var(--accent);cursor:pointer" onclick="toggleAll('api')">ALL</span>
      </div>
      <div id="fApi" style="display:flex;flex-wrap:wrap;gap:4px"></div>
    </div>
  </div>
  <div style="padding:10px 14px;border-top:1px solid var(--border)">
    <button onclick="exportZip()" style="width:100%;padding:9px;background:var(--text);color:#fff;border:none;border-radius:8px;font-size:11px;font-weight:700;cursor:pointer">Export Charts (ZIP)</button>
  </div>
</aside>

<!-- MAIN -->
<main style="flex:1;display:flex;flex-direction:column;overflow:hidden">
  <div id="summaryBar" style="padding:12px 24px;border-bottom:1px solid var(--border);background:#fff;display:none">
    <div style="display:flex;gap:24px;flex-wrap:wrap" id="sumCards"></div>
  </div>
  <div style="flex:1;overflow-y:auto;padding:24px" id="mainWrap">
    <div id="emptyMsg" style="display:flex;align-items:center;justify-content:center;height:100%;flex-direction:column;color:var(--sub)">
      <div style="font-size:44px;opacity:.3;margin-bottom:12px">&#128202;</div>
      <div style="font-size:16px;font-weight:700">No Data</div>
      <div style="font-size:12px;margin-top:4px">좌측에서 CSV 파일 업로드</div>
    </div>
    <div id="content" style="display:none"></div>
  </div>
</main>

<script>
// ============ STATE ============
const S={m:[],r:[],g:[],meta:{vus:new Set(),tc:new Set(),api:new Set(),mt:new Set()},f:{vus:[],tc:[],api:[]},charts:{}};
const C={rest:'#3b82f6',graphql:'#ec4899',grpc:'#22c55e',grpc_direct:'#22c55e',grpc_envoy:'#a855f7',grpc_part1:'#86efac',grpc_part2:'#4ade80',rest_part1:'#93c5fd',rest_part2:'#60a5fa',rest_error:'#3b82f6',graphql_error:'#ec4899',grpc_error:'#22c55e',REST:'#3b82f6',GRAPHQL:'#ec4899',GRPC:'#22c55e',DB:'#f59e0b',ENVOY:'#a855f7'};
const TL={tc1:'단건 조회',tc2:'페이징',tc3:'N+1 언더페칭',tc4:'부분 필드 추출',tc5:'다중 조인',tc6:'트랜잭션 쓰기',tc7:'에러 처리',tc8_spike:'스파이크 부하',tc9_simple:'프록시 단건',tc9_heavy:'프록시 대용량',tc9_error:'프록시 에러'};
const ML={http_req_duration:'Latency — 요청~응답 전체 소요시간',grpc_req_duration:'gRPC Latency — gRPC 요청 전체 소요시간',http_reqs:'Throughput — 초당 완료된 HTTP 요청 수',http_req_waiting:'TTFB (Waiting) — 서버가 첫 바이트를 보낼 때까지의 대기 시간. 서버 비즈니스 로직+DB 처리 시간 반영',http_req_blocked:'Blocked — 요청이 TCP 커넥션 풀 대기에 소비한 시간. 높으면 커넥션 부족',http_req_connecting:'Connecting — TCP 핸드셰이크 시간. gRPC는 HTTP/2 다중화로 0에 수렴',http_req_sending:'Sending — 요청 직렬화+전송 시간. Protobuf(gRPC)가 JSON(REST)보다 효율적',http_req_receiving:'Receiving — 응답 수신+역직렬화 시간. 대용량 페이로드(TC2,TC5)에서 JSON 비용 확인',http_req_failed:'Error Rate — 실패한 요청 비율. 0=성공, 1=실패. k6는 HTTP 상태 코드 기반 판정',checks:'Checks — k6 check() 통과 여부. 1=통과, 0=실패. 비즈니스 로직 정합성 검증'};
const MU={http_req_duration:'ms',grpc_req_duration:'ms',http_reqs:'count',http_req_waiting:'ms',http_req_blocked:'ms',http_req_connecting:'ms',http_req_sending:'ms',http_req_receiving:'ms',http_req_failed:'0/1',checks:'0/1'};
function gc(a){const k=a.toLowerCase();return C[k]||C[k.replace(/ /g,'_')]||'#64748b'}

// ============ PARSE ============
function handleDrop(e){e.preventDefault();document.getElementById('dropZone').classList.remove('dragover');handleFiles(e.dataTransfer.files)}
async function handleFiles(files){
  if(!files.length)return;document.getElementById('fileCount').textContent=files.length+'개 처리 중...';
  let done=0;
  for(const file of files){const text=await file.text();const fn=file.name.toLowerCase();const hdr=text.split('\n')[0]||'';
    const isRes=fn.includes('resource_')||hdr.includes('cpu_perc')||hdr.includes('cpu_ns');
    let vu='unknown';const m=fn.match(/_(\d+)_\d{8}/);if(m)vu=m[1];
    Papa.parse(text,{header:true,skipEmptyLines:true,complete:res=>{
      if(isRes)parseRes(res.data,fn,vu);else parseMet(res.data,fn,vu);
      if(++done===files.length)finalize()}})}}
function parseMem(s){if(!s)return 0;const p=s.split('/')[0].trim();const m=p.match(/([\d.]+)\s*(\w+)/);if(!m)return parseFloat(s)||0;const v=parseFloat(m[1]),u=m[2].toUpperCase();if(u.includes('G'))return v*1024;if(u.includes('K'))return v/1024;return v}
function parseRes(data,fn,vu){let mode='standard';const mm=fn.match(/resource_(.+?)_\d+_\d{8}/);if(mm)mode=mm[1];
  data.forEach(row=>{if(!row.time||!row.container)return;const c=row.container.replace('benchmark_','').toUpperCase();
    const cpu=parseFloat((row.cpu_perc||row.cpu_ns||'0').toString().replace('%',''));
    const mem=parseMem(row.mem_usage||row.memory_mb);
    S.r.push({time:new Date(row.time).getTime(),container:c,cpu,memory:mem,mode,vus:vu});S.meta.vus.add(vu)})}
function parseMet(data,fn,vu){const mn=fn.replace('.csv','').replace('_summary','');
  data.forEach(row=>{const val=row.value;if(val===undefined||val===null||val==='')return;if(!row.time)return;
    const tc=(row.tc||'').toLowerCase().trim();const api=(row.api||'').toLowerCase().trim();
    const vus=row.vus_group||vu;const mode=row.test_type||'standard';const metric=row.name||mn;const v=parseFloat(val);
    if(metric==='vus'||metric==='checks'){S.g.push({metric,time:new Date(row.time).getTime(),vus:String(vus),value:v});S.meta.vus.add(String(vus));return}
    if(!api||api==='unknown')return;
    S.m.push({metric,time:new Date(row.time).getTime(),tc,api,vus:String(vus),mode,value:v});
    if(tc)S.meta.tc.add(tc);S.meta.api.add(api);S.meta.vus.add(String(vus));S.meta.mt.add(metric)})}
function finalize(){
  document.getElementById('fileCount').textContent=(S.m.length+S.r.length)+' pts';
  document.getElementById('emptyMsg').style.display='none';document.getElementById('content').style.display='';
  document.getElementById('filterPanel').style.display='';document.getElementById('summaryBar').style.display='';
  S.f.vus=[...S.meta.vus].sort((a,b)=>parseInt(a)-parseInt(b));
  S.f.tc=[...S.meta.tc].sort();S.f.api=[...S.meta.api].sort();
  buildFilters();renderAll()}

// ============ FILTERS (독립형 — TC/API 종속 없음) ============
function buildFilters(){
  bChips('fVus','vus',[...S.meta.vus].sort((a,b)=>parseInt(a)-parseInt(b)),v=>v+' VUs');
  bChips('fTc','tc',[...S.meta.tc].sort(),v=>{const l=TL[v];return v.toUpperCase()+(l?' · '+l:'')});
  bChips('fApi','api',[...S.meta.api].sort(),v=>v.toUpperCase())}
function bChips(id,key,all,lFn){const el=document.getElementById(id);el.innerHTML='';
  all.forEach(v=>{const d=document.createElement('div');d.className='chip'+(S.f[key].includes(v)?' active':'');d.textContent=lFn(v);
    d.onclick=()=>{const i=S.f[key].indexOf(v);if(i>=0)S.f[key].splice(i,1);else S.f[key].push(v);buildFilters();renderAll()};el.appendChild(d)})}
function toggleAll(k){const all=k==='vus'?[...S.meta.vus]:k==='tc'?[...S.meta.tc]:[...S.meta.api];
  S.f[k]=S.f[k].length===all.length?[]:[...all];buildFilters();renderAll()}

// ============ RENDER ============
function renderAll(){renderSumBar();const c=document.getElementById('content');c.innerHTML='';
  renderSummaryTable(c);renderResourceSection(c);renderTCCards(c)}
function dc(id){if(S.charts[id]){S.charts[id].destroy();delete S.charts[id]}}
function fm(){return S.m.filter(d=>S.f.vus.includes(d.vus)&&S.f.tc.includes(d.tc)&&S.f.api.includes(d.api))}
function fr(){return S.r.filter(d=>S.f.vus.includes(d.vus))}

// --- Summary Bar ---
function renderSumBar(){
  const dur=fm().filter(d=>d.metric.includes('duration'));const n=dur.length;
  const avg=n?(dur.reduce((s,d)=>s+d.value,0)/n).toFixed(2):'-';
  const sv=dur.map(d=>d.value).sort((a,b)=>a-b);
  const p99=n?sv[Math.floor(n*.99)].toFixed(2):'-';const p999=n?sv[Math.min(Math.floor(n*.999),n-1)].toFixed(2):'-';
  document.getElementById('sumCards').innerHTML=`
    <div><div class="stat-value" style="color:var(--accent)">${avg}<span style="font-size:11px;color:var(--sub)"> ms</span></div><div class="stat-label">Avg Latency</div></div>
    <div><div class="stat-value" style="color:var(--orange)">${p99}<span style="font-size:11px;color:var(--sub)"> ms</span></div><div class="stat-label">p99</div></div>
    <div><div class="stat-value" style="color:var(--red)">${p999}<span style="font-size:11px;color:var(--sub)"> ms</span></div><div class="stat-label">p99.9</div></div>
    <div><div class="stat-value">${n.toLocaleString()}</div><div class="stat-label">Samples</div></div>`}

// --- Summary Table (Accordion) ---
function renderSummaryTable(parent){
  const dur=fm().filter(d=>d.metric.includes('duration'));
  if(!dur.length)return;
  const g={};dur.forEach(d=>{const k=d.vus+'|'+d.tc+'|'+d.api;if(!g[k])g[k]={vus:d.vus,tc:d.tc,api:d.api,v:[]};g[k].v.push(d.value)});
  const rows=Object.values(g).map(x=>{const s=x.v.sort((a,b)=>a-b);const n=s.length;return{vus:x.vus,tc:x.tc.toUpperCase(),api:x.api.toUpperCase(),n,
    avg:(s.reduce((a,b)=>a+b,0)/n).toFixed(2),min:s[0].toFixed(2),p50:s[Math.floor(n*.5)].toFixed(2),p95:s[Math.floor(n*.95)].toFixed(2),
    p99:s[Math.floor(n*.99)].toFixed(2),p999:s[Math.min(Math.floor(n*.999),n-1)].toFixed(2),max:s[n-1].toFixed(2)}}).sort((a,b)=>a.tc.localeCompare(b.tc)||a.api.localeCompare(b.api));
  const div=document.createElement('div');div.className='card';div.style.marginBottom='20px';
  div.innerHTML=`<div class="accordion-toggle open" onclick="this.classList.toggle('open');this.nextElementSibling.style.display=this.classList.contains('open')?'':'none'">
    <h3 style="font-size:14px;font-weight:700">Performance Summary <span style="font-size:11px;color:var(--sub);font-weight:500">(${rows.length} groups)</span></h3>
    <span class="arrow">▼</span></div>
    <div style="overflow-x:auto;margin-top:12px">
    <table style="width:100%;font-size:11px;border-collapse:collapse">
    <thead><tr style="border-bottom:2px solid var(--border)">
    ${['VUs','TC','API','N','Avg','Min','p50','p95','p99','p99.9','Max'].map((h,i)=>`<th style="padding:7px 5px;font-weight:700;text-align:${i>2?'right':'left'};font-size:10px;color:var(--sub)">${h}</th>`).join('')}
    </tr></thead><tbody>
    ${rows.map(r=>`<tr style="border-bottom:1px solid #f1f3f5">
      <td class="mono" style="padding:5px">${r.vus}</td>
      <td style="padding:5px"><span style="background:#eff6ff;color:var(--accent);font-size:10px;font-weight:700;padding:2px 6px;border-radius:4px">${r.tc}</span></td>
      <td style="padding:5px;color:${gc(r.api)};font-weight:600;font-size:11px">${r.api}</td>
      <td class="mono" style="padding:5px;text-align:right">${r.n}</td>
      <td class="mono" style="padding:5px;text-align:right">${r.avg}</td>
      <td class="mono" style="padding:5px;text-align:right">${r.min}</td>
      <td class="mono" style="padding:5px;text-align:right">${r.p50}</td>
      <td class="mono" style="padding:5px;text-align:right">${r.p95}</td>
      <td class="mono" style="padding:5px;text-align:right">${r.p99}</td>
      <td class="mono" style="padding:5px;text-align:right;font-weight:700">${r.p999}</td>
      <td class="mono" style="padding:5px;text-align:right">${r.max}</td></tr>`).join('')}
    </tbody></table></div>`;
  parent.appendChild(div)}

// --- Resource Section (모드별 분리 + DB/API 분리) ---
function renderResourceSection(parent){
  const rd=fr();if(!rd.length)return;
  const modes=[...new Set(rd.map(d=>d.mode))].sort();
  const modeLabels={standard:'Standard (격리 테스트)',proxy_overhead:'Proxy Overhead (Envoy)'};
  const sec=document.createElement('div');sec.style.marginBottom='20px';
  sec.innerHTML=`<div class="section-title"><span class="dot" style="background:var(--orange)"></span>Resource Monitoring</div>
    <p class="desc">cAdvisor/docker stats에서 수집한 컨테이너별 CPU·메모리 사용량. 테스트 모드별로 분리 표시. X축: 경과 시간(초), Y축: CPU(%), Memory(MiB). DB는 메모리 규모가 다르므로 별도 차트로 분리.</p>`;
  
  modes.forEach(mode=>{
    const mData=rd.filter(d=>d.mode===mode).sort((a,b)=>a.time-b.time);
    if(!mData.length)return;
    const t0=mData[0].time;
    const containers=[...new Set(mData.map(d=>d.container))].sort();
    const apiContainers=containers.filter(c=>c!=='DB');
    const dbContainers=containers.filter(c=>c==='DB');

    const grid=document.createElement('div');
    grid.style.cssText='display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px';

    // CPU chart
    const cpuId='res_cpu_'+mode;
    grid.innerHTML+=`<div class="card" style="padding:14px"><h4 style="font-size:12px;font-weight:700;margin-bottom:6px">${modeLabels[mode]||mode} — CPU Usage (%)</h4><div style="height:220px"><canvas id="${cpuId}"></canvas></div></div>`;
    // Memory API chart
    const memApiId='res_memapi_'+mode;
    grid.innerHTML+=`<div class="card" style="padding:14px"><h4 style="font-size:12px;font-weight:700;margin-bottom:6px">${modeLabels[mode]||mode} — Memory: API 서버 (MiB)</h4><div style="height:220px"><canvas id="${memApiId}"></canvas></div></div>`;
    // Memory DB chart
    if(dbContainers.length){
      const memDbId='res_memdb_'+mode;
      grid.innerHTML+=`<div class="card" style="padding:14px"><h4 style="font-size:12px;font-weight:700;margin-bottom:6px">${modeLabels[mode]||mode} — Memory: DB (MiB)</h4><div style="height:220px"><canvas id="${memDbId}"></canvas></div></div>`;
    }
    sec.appendChild(grid);

    setTimeout(()=>{
      function mkDs(conts,field){return conts.map(c=>{
        const pts=mData.filter(d=>d.container===c);
        return{label:c,data:pts.map(d=>({x:+((d.time-t0)/1000).toFixed(1),y:d[field]})),
          borderColor:C[c]||'#64748b',backgroundColor:(C[c]||'#64748b')+'15',borderWidth:2,tension:.2,pointRadius:0,fill:true}})}
      const opts=yL=>({responsive:true,maintainAspectRatio:false,animation:false,interaction:{mode:'index',intersect:false},
        plugins:{legend:{labels:{font:{size:10,weight:'600',family:'IBM Plex Sans'},usePointStyle:true,padding:10}}},
        scales:{x:{type:'linear',title:{display:true,text:'Elapsed (s)',font:{size:10,weight:'600'}},ticks:{callback:v=>v+'s',font:{size:9}}},
          y:{beginAtZero:true,title:{display:true,text:yL,font:{size:10,weight:'600'}},ticks:{font:{size:9}}}}});
      dc(cpuId);S.charts[cpuId]=new Chart(document.getElementById(cpuId),{type:'line',data:{datasets:mkDs(containers,'cpu')},options:opts('CPU (%)')});
      dc(memApiId);S.charts[memApiId]=new Chart(document.getElementById(memApiId),{type:'line',data:{datasets:mkDs(apiContainers,'memory')},options:opts('Memory (MiB)')});
      if(dbContainers.length){const memDbId='res_memdb_'+mode;dc(memDbId);
        S.charts[memDbId]=new Chart(document.getElementById(memDbId),{type:'line',data:{datasets:mkDs(dbContainers,'memory')},options:opts('Memory (MiB)')})}
    },20)});
  parent.appendChild(sec)}

// --- TC Cards (통합 뷰: 핵심 메트릭을 한 카드에) ---
function renderTCCards(parent){
  const data=fm();if(!data.length)return;
  const tcs=[...new Set(data.map(d=>d.tc))].sort();
  const sec=document.createElement('div');
  sec.innerHTML=`<div class="section-title"><span class="dot" style="background:var(--accent)"></span>TC별 성능 분석</div>`;

  tcs.forEach(tc=>{
    const tcData=data.filter(d=>d.tc===tc);
    const card=document.createElement('div');card.className='card';card.style.marginBottom='16px';
    const label=TL[tc]||'';
    
    // 해당 TC에서 사용 가능한 메트릭 분류
    const durData=tcData.filter(d=>d.metric.includes('duration'));
    const waitData=tcData.filter(d=>d.metric==='http_req_waiting');
    const sendData=tcData.filter(d=>d.metric==='http_req_sending');
    const recvData=tcData.filter(d=>d.metric==='http_req_receiving');
    const blockData=tcData.filter(d=>d.metric==='http_req_blocked');
    const connData=tcData.filter(d=>d.metric==='http_req_connecting');

    // 차트 레이아웃 결정
    const charts=[];
    if(durData.length) charts.push({id:`tc_dur_${tc}`,data:durData,title:'Latency (ms)',desc:ML.http_req_duration,unit:'ms'});
    if(waitData.length) charts.push({id:`tc_wait_${tc}`,data:waitData,title:'TTFB / Waiting (ms)',desc:ML.http_req_waiting,unit:'ms'});
    if(sendData.length) charts.push({id:`tc_send_${tc}`,data:sendData,title:'Sending (ms)',desc:ML.http_req_sending,unit:'ms'});
    if(recvData.length) charts.push({id:`tc_recv_${tc}`,data:recvData,title:'Receiving (ms)',desc:ML.http_req_receiving,unit:'ms'});
    if(blockData.length) charts.push({id:`tc_block_${tc}`,data:blockData,title:'Blocked (ms)',desc:ML.http_req_blocked,unit:'ms'});
    if(connData.length) charts.push({id:`tc_conn_${tc}`,data:connData,title:'Connecting (ms)',desc:ML.http_req_connecting,unit:'ms'});

    // 헤더
    let html=`<div style="display:flex;align-items:center;gap:8px;margin-bottom:12px">
      <span style="background:var(--accent);color:#fff;font-size:11px;font-weight:700;padding:3px 8px;border-radius:5px">${tc.toUpperCase()}</span>
      <span style="font-size:13px;font-weight:700">${label}</span></div>`;
    
    // p99.9 미니 테이블
    if(durData.length){
      const ag={};durData.forEach(d=>{if(!ag[d.api])ag[d.api]=[];ag[d.api].push(d.value)});
      html+=`<div style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:12px">`;
      Object.entries(ag).sort().forEach(([api,vals])=>{
        const s=vals.sort((a,b)=>a-b);const n=s.length;
        const avg=(s.reduce((a,b)=>a+b,0)/n).toFixed(2);
        const p999=s[Math.min(Math.floor(n*.999),n-1)].toFixed(2);
        html+=`<div style="background:#f8fafc;border:1px solid var(--border);border-radius:8px;padding:8px 12px;min-width:120px">
          <div style="font-size:10px;font-weight:700;color:${gc(api)};margin-bottom:4px">${api.toUpperCase()}</div>
          <div style="font-size:10px;color:var(--sub)">Avg: <span class="mono" style="font-weight:600">${avg} ms</span></div>
          <div style="font-size:10px;color:var(--sub)">p99.9: <span class="mono" style="font-weight:700">${p999} ms</span></div>
          <div style="font-size:10px;color:var(--sub)">Samples: <span class="mono">${n}</span></div></div>`});
      html+=`</div>`}

    // 차트 그리드
    const cols=charts.length===1?'1fr':charts.length<=2?'1fr 1fr':'1fr 1fr 1fr';
    html+=`<div style="display:grid;grid-template-columns:${cols};gap:12px">`;
    charts.forEach(ch=>{
      html+=`<div style="border:1px solid var(--border);border-radius:8px;padding:10px">
        <div style="font-size:11px;font-weight:700;margin-bottom:2px">${ch.title}</div>
        <div style="font-size:9px;color:var(--sub);margin-bottom:8px">${ch.desc.split('—')[1]||''}</div>
        <div style="height:200px"><canvas id="${ch.id}"></canvas></div></div>`});
    html+=`</div>`;
    card.innerHTML=html;sec.appendChild(card);

    // 차트 렌더링
    setTimeout(()=>{charts.forEach(ch=>{
      const ctx=document.getElementById(ch.id);if(!ctx)return;
      const ag={};ch.data.forEach(d=>{if(!ag[d.api])ag[d.api]=[];ag[d.api].push(d)});
      const datasets=Object.entries(ag).map(([api,rows])=>{
        rows.sort((a,b)=>a.time-b.time);const s=rows[0].time;
        return{label:api.toUpperCase(),data:rows.map(d=>({x:+((d.time-s)/1000).toFixed(1),y:d.value})),
          borderColor:gc(api),borderWidth:2,tension:.2,pointRadius:0,fill:false}});
      dc(ch.id);S.charts[ch.id]=new Chart(ctx,{type:'line',data:{datasets},
        options:{responsive:true,maintainAspectRatio:false,animation:false,interaction:{mode:'index',intersect:false},
          plugins:{legend:{labels:{font:{size:9,weight:'600'},usePointStyle:true,padding:8}}},
          scales:{x:{type:'linear',ticks:{callback:v=>v+'s',font:{size:8}},title:{display:true,text:'경과 시간 (초)',font:{size:9}}},
            y:{beginAtZero:true,ticks:{font:{size:8}},title:{display:true,text:ch.unit,font:{size:9}}}}}})})},30)});
  parent.appendChild(sec)}

// --- Export ---
async function exportZip(){const ids=Object.keys(S.charts);if(!ids.length)return alert('차트 없음');
  const zip=new JSZip();for(const id of ids){const cv=document.getElementById(id);if(!cv)continue;
    const t=document.createElement('canvas');t.width=cv.width;t.height=cv.height;const c=t.getContext('2d');
    c.fillStyle='#fff';c.fillRect(0,0,t.width,t.height);c.drawImage(cv,0,0);
    zip.file(id+'.png',t.toDataURL('image/png').split(',')[1],{base64:true})}
  const blob=await zip.generateAsync({type:'blob'});const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download='benchmark_'+Date.now()+'.zip';a.click()}
</script>
