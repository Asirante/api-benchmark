services:
  db:
    image: postgres:15-alpine
    container_name: benchmark_db
    # 대규모 접속 처리를 위해 max_connections 및 메모리 최적화 설정 적용
    command: postgres -c 'max_connections=5000' -c 'shared_buffers=1GB' -c 'work_mem=32MB'
    environment:
      POSTGRES_USER: benchmark_user
      POSTGRES_PASSWORD: benchmark_password
      POSTGRES_DB: olist_db
    ports:
      - "5432:5432"
    volumes:
      - ./init-db:/docker-entrypoint-initdb.d
      - ./data:/data
      - pgdata:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M

  rest-api:
    build: 
      context: .
      dockerfile: Dockerfile.rest
    container_name: benchmark_rest
    ports:
      - "8080:8080"
    depends_on:
      - db
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=benchmark_user
      - DB_PASS=benchmark_password
      - DB_NAME=olist_db
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M

  graphql-api:
    build: 
      context: .
      dockerfile: Dockerfile.graphql
    container_name: benchmark_graphql
    ports:
      - "8081:8081"
    depends_on:
      - db
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=benchmark_user
      - DB_PASS=benchmark_password
      - DB_NAME=olist_db
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M

  grpc-api:
    build: 
      context: .
      dockerfile: Dockerfile.grpc
    container_name: benchmark_grpc
    ports:
      - "50051:50051"
    depends_on:
      - db
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=benchmark_user
      - DB_PASS=benchmark_password
      - DB_NAME=olist_db
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M

  envoy:
    image: envoyproxy/envoy:v1.27.0
    container_name: benchmark_envoy
    volumes:
      - ./envoy.yaml:/etc/envoy/envoy.yaml
    ports:
      - "8082:8082" 
      - "9901:9901"
    depends_on:
      - grpc-api
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1024M

  influxdb:
    image: influxdb:1.8
    container_name: benchmark_influxdb
    ports:
      - "8086:8086"
    environment:
      - INFLUXDB_DB=k6

  grafana:
    image: grafana/grafana:latest
    container_name: benchmark_grafana
    ports:
      - "3000:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_BASIC_ENABLED=false
    depends_on:
      - influxdb
    volumes:
      - grafana_data:/var/lib/grafana

volumes:
  pgdata:
  grafana_data: